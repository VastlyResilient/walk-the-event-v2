<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#07050b;overflow:hidden;font-family:Manrope,sans-serif;color:#f6f3ee}

.pill{display:inline-block;margin-top:24px;padding:12px 20px;border-radius:999px;background:#f6f3ee;color:#0b0a10;font-weight:800;font-size:18px}
</style></head><body>
<div class="bg"><img class="a" id="shot" src=""></div><div class="shade"></div>
